[package]
name = "r2ui-egui-lightlaf-demo"
version = "0.1.0"
edition = "2021"
description = "FlatLaf Light 风格的 egui UI 复用骨架 —— 主题层 + 原子组件层 + 面板层 demo"

[dependencies]
# fluent-egui 0.1.1 依赖 eframe ^0.35
fluent-egui = "0.1.1"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }

# 文件/目录选择对话框（阻塞 API，不启用异步特性）
rfd = { version = "0.15", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
