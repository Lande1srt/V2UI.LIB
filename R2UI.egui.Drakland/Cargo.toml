[package]
name = "r2ui"
version = "0.1.0"
edition = "2021"
authors = ["R2UI"]
description = "R2UI.egui - 可复用 egui UI 组件库 (Drakland 主题)"

[lib]
name = "r2ui"
path = "src/lib.rs"

[[bin]]
name = "r2ui_demo"
path = "src/bin/demo.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"

[profile.release]
opt-level = 2
